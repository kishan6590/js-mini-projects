<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <h1>Password Generator</h1>
      <input placeholder="Generate Your Password" type="text" id="inputField" disabled />
      <span id="copyIcon"><i class="fa-regular fa-copy"></i><span id="copyTitle">! Copied Password</span></span>
      <input id="slider" type="range" max="15" min="0" value="9" />
      <div class="row">
        <label for="length">Password Length</label>
        <span id="passwordLength">4</span>
      </div>
      <div class="row">
        <label for="lowerCase">Include LowerCase Letters (a-z)</label>
        <input id="lowerCase" type="checkbox" />
      </div>

      <div class="row">
        <label for="upperCase">Include UpperCase Letters (A-Z)</label>
        <input id="upperCase" type="checkbox" />
      </div>

      <div class="row">
        <label for="number">Include Numbers (0-9)</label>
        <input type="checkbox" id="number" />
      </div>
      <div class="row">
        <label for="symbols">Include Symbols (@-*&)</label>
        <input type="checkbox" id="symbols" />
      </div>

      <button>Generate Password</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>

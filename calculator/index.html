<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <input id="input" type="text" placeholder="0" />
      <div class="div">
        <button class="operator">AC</button>
        <button class="operator">( )</button>
        <button class="operator">%</button>
        <button class="operator">/</button>
      </div>
      <div class="div">
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">*</button>
      </div>
      <div class="div">
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">-</button>
      </div>
      <div class="div">
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator">+</button>
      </div>
      <div class="div">
        <button>0</button>
        <button>.</button>
        <button class="del-btn">DEL</button>
        <button class="eql-btn">=</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
